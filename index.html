<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text Reverser</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1d2330;
      --muted: #6b7280;
      --border: #d7dbe2;
      --accent: #2563eb;
      --word: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151b;
        --card: #1b2029;
        --text: #e6e9ef;
        --muted: #9aa3b2;
        --border: #2e3542;
        --accent: #60a5fa;
        --word: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }
    h1 { margin: 0 0 4px; font-size: 1.5rem; }
    p.hint { margin: 0 0 20px; color: var(--muted); }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input {
      width: 100%;
      font: inherit;
      font-size: 1.1rem;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    output {
      display: block;
      min-height: 2.6em;
      margin-top: 6px;
      padding: 10px 12px;
      border: 1px dashed var(--border);
      border-radius: 8px;
      font-size: 1.1rem;
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .real {
      text-decoration: underline;
      text-decoration-color: var(--word);
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
    }
    .row { margin-top: 18px; }
    .legend { margin: 10px 0 0; font-size: 0.9rem; color: var(--muted); }
    .legend .real { color: var(--text); }
    #status { margin: 4px 0 0; font-size: 0.85rem; color: var(--muted); min-height: 1.2em; }
    button {
      margin-top: 12px;
      font: inherit;
      padding: 8px 14px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <main>
    <h1>Text Reverser</h1>
    <p class="hint">Type anything — e.g. “con” becomes “noc”.</p>

    <label for="input">Your text</label>
    <input id="input" type="text" dir="auto" placeholder="con" autocomplete="off" autofocus>

    <div class="row">
      <label for="result">Reversed</label>
      <output id="result" for="input" dir="auto" aria-live="polite"></output>
      <p class="legend"><span class="real">underlined</span> = a real English or Hebrew word</p>
      <p id="status"></p>
      <button id="copy" type="button" disabled>Copy</button>
    </div>
  </main>

  <script>
    // ---------- Reversal ----------
    // Reverse by user-perceived characters (graphemes) so emoji and
    // accented letters stay intact; fall back to code points.
    function reverse(text) {
      if (typeof Intl !== "undefined" && Intl.Segmenter) {
        const seg = new Intl.Segmenter(undefined, { granularity: "grapheme" });
        return Array.from(seg.segment(text), s => s.segment).reverse().join("");
      }
      return Array.from(text).reverse().join("");
    }

    // Split text into [{ text, isWord }] pieces, keeping spaces/punctuation.
    function tokenize(text) {
      return text.split(/([\p{L}\p{M}']+)/u)
        .filter(t => t !== "")
        .map(t => ({ text: t, isWord: /\p{L}/u.test(t) }));
    }

    // ---------- Dictionary lookup (Wiktionary) ----------
    const HEB_FINAL = { "ך": "כ", "ם": "מ", "ן": "נ", "ף": "פ", "ץ": "צ" };
    const HEB_TO_FINAL = { "כ": "ך", "מ": "ם", "נ": "ן", "פ": "ף", "צ": "ץ" };

    // Normalize a word for lookup: lowercase, strip apostrophes at the ends,
    // and for Hebrew remove vowel points and fix final letters (reversing
    // "מים" gives "מימ", which should be looked up as "מים").
    function lookupKey(word) {
      let w = word.toLowerCase().replace(/^'+|'+$/g, "");
      if (/[א-ת]/.test(w)) {
        w = w.replace(/[֑-ׇ]/g, "");
        w = w.replace(/[ךםןףץ]/g, c => HEB_FINAL[c]);
        const last = w.slice(-1);
        if (HEB_TO_FINAL[last]) w = w.slice(0, -1) + HEB_TO_FINAL[last];
      }
      return w;
    }

    const CATEGORIES = [
      "Category:English lemmas",
      "Category:English non-lemma forms",
      "Category:Hebrew lemmas",
      "Category:Hebrew non-lemma forms",
    ];
    const cache = new Map();   // key -> true / false
    const MIN_LEN = 2;         // skip single letters (every letter has a dictionary page)

    // Ask Wiktionary which of these titles are English/Hebrew words.
    async function lookup(keys) {
      const params = new URLSearchParams({
        action: "query",
        format: "json",
        formatversion: "2",
        origin: "*",
        prop: "categories",
        cllimit: "max",
        clcategories: CATEGORIES.join("|"),
        titles: keys.join("|"),
      });
      const res = await fetch("https://en.wiktionary.org/w/api.php?" + params);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const q = data.query || {};
      const titleToKey = new Map(keys.map(k => [k, k]));
      for (const n of q.normalized || []) titleToKey.set(n.to, n.from);
      const found = new Set();
      for (const p of q.pages || []) {
        if (!p.missing && p.categories && p.categories.length) {
          found.add(titleToKey.get(p.title) ?? p.title);
        }
      }
      for (const k of keys) cache.set(k, found.has(k));
    }

    // ---------- UI ----------
    const input = document.getElementById("input");
    const result = document.getElementById("result");
    const copy = document.getElementById("copy");
    const status = document.getElementById("status");

    function render() {
      const reversed = reverse(input.value);
      result.textContent = "";
      for (const tok of tokenize(reversed)) {
        const key = tok.isWord ? lookupKey(tok.text) : null;
        if (key && cache.get(key) === true) {
          const span = document.createElement("span");
          span.className = "real";
          span.title = "Real word";
          span.textContent = tok.text;
          result.appendChild(span);
        } else {
          result.appendChild(document.createTextNode(tok.text));
        }
      }
      return reversed;
    }

    let timer = null;
    let runId = 0;
    async function checkWords() {
      const id = ++runId;
      const keys = [...new Set(
        tokenize(reverse(input.value))
          .filter(t => t.isWord)
          .map(t => lookupKey(t.text))
          .filter(k => Array.from(k).length >= MIN_LEN && !cache.has(k))
      )];
      if (!keys.length) { status.textContent = ""; return; }
      status.textContent = "Checking dictionary…";
      try {
        for (let i = 0; i < keys.length; i += 50) {
          await lookup(keys.slice(i, i + 50));   // API allows 50 titles per request
        }
        if (id === runId) status.textContent = "";
      } catch (err) {
        if (id === runId) status.textContent = "Couldn’t reach the dictionary (offline?).";
      }
      render();
    }

    input.addEventListener("input", () => {
      render();
      copy.disabled = input.value.length === 0;
      copy.textContent = "Copy";
      clearTimeout(timer);
      timer = setTimeout(checkWords, 350);
    });

    copy.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(result.textContent);
        copy.textContent = "Copied!";
      } catch {
        copy.textContent = "Copy failed";
      }
    });
  </script>
</body>
</html>
